<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Text Testing</title>
</head>
<body>
    
    <h1 class="title">Text Testing</h1>
    <h2 class="title">By Bean</h2>
    <p>This is a testing version for a website I want to make</p>
    <p>Place text here below to save</p>
    
    <input id="textBox" type="text" placeholder="Type something...">
    <button onclick="saveText()">Save</button>

    <script>
    async function saveText() {
        const text = document.getElementById("textBox").value;

        const response = await fetch("/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text: text })
        });

        if (response.ok) {
            alert("Saved!");
        } else {
            alert("Something went wrong.");
        }
    }
</script>
</body>
</html>
